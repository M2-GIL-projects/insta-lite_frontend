<div class="container mt-4">
    <h2 class="mb-4">Modifier le profil</h2>
    <form>
        <div class="mb-3">
            <label for="profilePic" class="form-label">Photo de profil</label>
            <input type="file" class="form-control" id="profilePic">
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">Nom d'utilisateur</label>
            <input type="text" class="form-control" id="username" value="nom_utilisateur">
        </div>
        <div class="mb-3">
            <label for="bio" class="form-label">Biographie</label>
            <textarea class="form-control" id="bio" rows="3">Biographie actuelle de l'utilisateur.</textarea>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" value="utilisateur@example.com">
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">Téléphone</label>
            <input type="tel" class="form-control" id="phone" value="+33 6 12 34 56 78">
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer les modifications</button>
    </form>
</div>

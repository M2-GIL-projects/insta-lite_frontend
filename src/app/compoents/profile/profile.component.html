<div class="container mt-5">
    <div class="row">
      <div class="col-md-4">
        <img [src]="user?.avatarUrl" class="img-fluid rounded-circle" alt="Avatar">
      </div>
      <div class="col-md-8">
        <h2>{{ user?.name }}</h2>
        <p>{{ user?.bio }}</p>
        <div class="mt-3">
          <h4>Mes informations</h4>
          <ul class="list-group">
            <li class="list-group-item">Email: {{ user?.email }}</li>
            <li class="list-group-item" *ngIf="user?.joinDate">Membre depuis: {{ user?.joinDate | date:'longDate' }}</li>
          </ul>
        </div>
      </div>
    </div>
  </div>

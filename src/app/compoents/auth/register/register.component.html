<div class="auth-container">
  <div class="auth-card">
    <img src="assets/images/logo-instagram.png" alt="Instagram Logo" class="logo" />
    <h2 class="form-title">Inscription</h2>
    <form (ngSubmit)="onRegister()">
      <!-- Nom complet -->
      <div class="form-group">
        <input
          type="text"
          [(ngModel)]="fullName"
          name="fullName"
          placeholder="Nom complet"
          class="form-control"
          required
        />
      </div>
      <!-- Email -->
      <div class="form-group">
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="Email"
          class="form-control"
          required
        />
      </div>
      <!-- Mot de passe -->
      <div class="form-group">
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="Mot de passe"
          class="form-control"
          required
        />
      </div>
      <!-- Bouton -->
      <button type="submit" class="btn btn-primary">S'inscrire</button>
    </form>
  </div>
</div>

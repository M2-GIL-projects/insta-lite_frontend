<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">{{ isEditMode ? 'Modifier le post' : 'Créer un nouveau post' }}</h2>
    </div>
    <div class="card-body">
      <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
        <!-- Contenu du post -->
        <div class="mb-3">
          <label for="content" class="form-label fw-bold">Contenu</label>
          <textarea 
            class="form-control" 
            id="content" 
            rows="3" 
            formControlName="content" 
            placeholder="Écrivez ici votre contenu..."></textarea>
          <div *ngIf="postForm.get('content')?.invalid && postForm.get('content')?.touched" class="text-danger mt-1">
            <small *ngIf="postForm.get('content')?.errors?.['required']">Le contenu est requis.</small>
            <small *ngIf="postForm.get('content')?.errors?.['maxlength']">Le contenu ne doit pas dépasser 255 caractères.</small>
          </div>
        </div>

        <!-- Option Privé -->
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="isPrivate" formControlName="isPrivate" (change)="onPrivacyChange()">
          <label class="form-check-label" for="isPrivate">Rendre privé</label>
        </div>

        <!-- Bouton de soumission -->
        <button 
          type="submit" 
          class="btn btn-primary w-100" 
          [disabled]="!postForm.valid">
          {{ isEditMode ? 'Mettre à jour le post' : 'Créer le post' }}
        </button>
      </form>
    </div>
  </div>
</div>




<!-- Modale pour ajout de médias -->
<ng-template #mediaModal let-modal>
  <div class="modal-content">
    <!-- En-tête de la modale -->
    <div class="modal-header bg-secondary text-white">
      <h4 class="modal-title">Ajouter des médias au post</h4>
      <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
    </div>

    <!-- Corps de la modale -->
    <div class="modal-body">
      <!-- Entrée pour le téléchargement de fichiers -->
      <div class="mb-3">
        <label for="files" class="form-label fw-bold">Images ou Vidéos</label>
        <input 
          type="file" 
          class="form-control" 
          id="files" 
          (change)="onFilesSelected($event)" 
          accept="image/*,video/*" 
          multiple>
      </div>

      <!-- Aperçu des fichiers -->
      <div class="mb-3" *ngIf="previewUrls.length > 0">
        <h5>Aperçu des fichiers sélectionnés :</h5>
        <div class="row">
          <div 
            class="col-md-3 mb-2 d-flex justify-content-center align-items-center" 
            *ngFor="let url of previewUrls; let i = index">
            <img *ngIf="selectedFiles[i].type.startsWith('image/')" 
                 [src]="url" 
                 class="img-thumbnail shadow-sm" 
                 alt="Aperçu image"
                 style="width: 100%; height: auto;">
            <video *ngIf="selectedFiles[i].type.startsWith('video/')" 
                   [src]="url" 
                   class="img-thumbnail shadow-sm" 
                   controls
                   style="width: 100%; height: auto;"></video>
          </div>
        </div>
      </div>
    </div>

    <!-- Pied de la modale -->
    <div class="modal-footer">
      <button type="button" class="btn btn-outline-primary" (click)="addMediaToPost()">
        Ajouter les médias
      </button>
      <button type="button" class="btn btn-outline-danger" (click)="annuler()">
       Annuler
      </button>
    </div>
  </div>
</ng-template>

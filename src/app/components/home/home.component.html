<div class="container mt-4">
  <div class="row">
    <!-- Section principale des posts -->
    <div class="col-md-8">
      <div *ngFor="let post of posts" class="card mb-4 shadow-sm">
        <!-- En-tête du post -->
        <div class="card-header d-flex align-items-center">
          <img
            [src]="getImageUrl(post.user.profileImg) || 'assets/default.jpg'"
            class="rounded-circle"
            width="40"
            height="40"
            alt="Avatar"
          />
          <span class="ms-2 fw-bold">{{ post.user.pseudo }}</span>
        </div>

        <!-- Média du post (image ou vidéo) -->
        <div (click)="openHomeModal('publication', post)" class="post-media">
          <img
            *ngIf="post.pictures && post.pictures.length > 0"
            [src]="getImageUrl(post.pictures[0].url)"
            class="img-fluid rounded"
            alt="Post"
          />
          <video
            *ngIf="post.videos && post.videos.length > 0"
            [src]="getImageUrl(post.videos[0].url)"
            class="video-fluid rounded"
            controls
          ></video>
        </div>

        <!-- Corps du post -->
        <div class="card-body">
          <p (click)="openHomeModal('publication', post)" >{{ post.content }}</p>
          <div class="d-flex align-items-center mb-3">
            <button
              (click)="likePost(post.id)"
              class="btn btn-sm btn-outline-danger me-3"
            >
              <i class="fas fa-heart me-1"></i>{{ post.likes?.length }} 
            </button>
            <button
              (click)="openCommentModal(post.id)"
              class="btn btn-sm btn-outline-info"
            >
              <i class="fas fa-comment me-1"></i>{{ post.comments?.length }} 
            </button>
          </div>

          <!-- Liste des commentaires -->
          <div *ngFor="let comment of post.comments || []" class="comment ps-3">
            <p>
              <strong>{{ comment.content }}</strong>
              <small class="text-muted d-block">
                <i class="far fa-clock"></i> {{ comment.createdAt | date: 'short' }}
              </small>
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Section des suggestions -->
    <div class="col-lg-4">
      <div class="p-3 bg-white rounded shadow-sm">
        <h5 class="mb-3">
          <i class="fas fa-user-friends me-2"></i>Suggestions
        </h5>

        <div
          *ngFor="let suggestion of suggestions"
          class="d-flex align-items-center mb-3"
        >
          <img
            [src]="suggestion.profileImg || 'https://picsum.photos/50/50'"
            alt="Suggestion"
            class="rounded-circle me-3"
            width="50"
            height="50"
          />
          <div>
            <h6 class="mb-0">{{ suggestion.pseudo }}</h6>
          </div>
          <button class="btn btn-outline-primary btn-sm ms-auto">
            <i class="fas fa-user-plus me-1"></i>Suivre
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

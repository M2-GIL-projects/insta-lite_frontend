<div id="users" class="container mt-2">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex align-items-center">
            <h2 class="m-0">
                <i class="fas fa-users"></i> Gestion des utilisateurs
            </h2>
        </div>
        <div class="card-body">
            <button 
                (click)="onCreateUser()" 
                class="btn btn-primary mb-3" 
                data-toggle="modal" 
                data-target="#addUserModal">
                <i class="fas fa-user-plus"></i> Ajouter un utilisateur
            </button>
            <div class="table-responsive">
                <table class="table table-striped table-bordered">
                    <thead class="thead-dark">
                        <tr>
                            <th><i class="fas fa-id-badge"></i> ID</th>
                            <th><i class="fas fa-user"></i> Pseudo</th>
                            <th><i class="fas fa-envelope"></i> Email</th>
                            <th><i class="fas fa-phone"></i> Téléphone</th>
                            <th><i class="fas fa-user-tag"></i> Rôle</th>
                            <th><i class="fas fa-calendar-alt"></i> Créé depuis</th>
                            <th><i class="fas fa-cogs"></i> Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let user of users">
                            <td>{{user.id}}</td>
                            <td>{{user.pseudo}}</td>
                            <td>{{user.email}}</td>
                            <td>{{user.phone}}</td>
                            <td>{{user.role}}</td>
                            <td>{{user.createdAt | date: 'short'}}</td>
                            <td>
                                <button 
                                    *ngIf="user.id !== undefined" 
                                    (click)="onUpdate(user.id)" 
                                    class="btn btn-sm btn-warning me-1">
                                    <i class="fas fa-edit"></i> 
                                </button>
                                <button 
                                    *ngIf="user.id !== undefined" 
                                    (click)="onDelete(user.id)" 
                                    class="btn btn-sm btn-danger me-1">
                                    <i class="fas fa-trash"></i> 
                                </button>
                                <button 
                                    *ngIf="user.id !== undefined" 
                                    (click)="onView(user.id)" 
                                    class="btn btn-sm btn-info me-1">
                                    <i class="fas fa-eye"></i> 
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div id="dashboard" class="container mt-4">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white d-flex align-items-center">
            <h2 class="m-0">
                <i class="fas fa-chart-line"></i> Tableau de bord
            </h2>
        </div>
        <div class="card-body">
            <div class="row text-center">
                <!-- Users Card -->
                <div class="col-md-3">
                    <div class="card mb-3 shadow border-0">
                        <div class="card-header bg-primary text-white">
                            <h4 class="m-0"><i class="fas fa-users"></i> Utilisateurs</h4>
                        </div>
                        <div class="card-body">
                            <h1 class="card-title text-primary">{{users.length}}</h1>
                            <button routerLink="/users" class="btn btn-outline-primary" type="button">
                                <i class="fas fa-arrow-right"></i> Voir plus
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Images Card -->
                <div class="col-md-3">
                    <div class="card mb-3 shadow border-0">
                        <div class="card-header bg-info text-white">
                            <h4 class="m-0"><i class="fas fa-images"></i> Images</h4>
                        </div>
                        <div class="card-body">
                            <h1 class="card-title text-info">{{images.length}}</h1>
                            <button routerLink="/images" class="btn btn-outline-info" type="button">
                                <i class="fas fa-arrow-right"></i> Voir plus
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Videos Card -->
                <div class="col-md-3">
                    <div class="card mb-3 shadow border-0">
                        <div class="card-header bg-warning text-dark">
                            <h4 class="m-0"><i class="fas fa-video"></i> Vidéos</h4>
                        </div>
                        <div class="card-body">
                            <h1 class="card-title text-warning">{{videos.length}}</h1>
                            <button routerLink="/videos" class="btn btn-outline-warning" type="button">
                                <i class="fas fa-arrow-right"></i> Voir plus
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Posts Card -->
                <div class="col-md-3">
                    <div class="card mb-3 shadow border-0">
                        <div class="card-header bg-danger text-white">
                            <h4 class="m-0"><i class="fas fa-file-alt"></i> Publications</h4>
                        </div>
                        <div class="card-body">
                            <h1 class="card-title text-danger">{{posts.length}}</h1>
                            <button routerLink="/posts" class="btn btn-outline-danger" type="button">
                                <i class="fas fa-arrow-right"></i> Voir plus
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

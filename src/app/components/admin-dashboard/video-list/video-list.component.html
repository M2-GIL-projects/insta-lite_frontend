<div class="container-fluid p-4">
    <div id="videos" class="card shadow mb-4">
        <div class="card-header bg-primary text-white d-flex align-items-center">
            <h2 class="m-0">
                <i class="fas fa-video"></i> Gestion des vidéos
            </h2>
        </div>
        
        <div class="card-body">
            <table class="table table-striped" *ngIf="videos.length > 0; else noVideosTemplate">
                <thead class="thead-dark">
                    <tr>
                        <th>ID</th>
                        <th>Preview</th>
                        <th>Extension</th>
                        <th>Visibilité</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let video of videos">
                        <td>{{video.id}}</td>
                        <td> <video [src]="getImageUrl(video.url)"
                            alt="image"
                            controls
                            class="rounded-circle me-2"
                            style="width: 40px; height: 40px"></video></td>
                        <td>{{video.extension}}</td>
                        <td>{{video.isPrivate ? "Privé" : "Public"}}</td>
                        <td>
                            <button class="btn btn-sm btn-warning me-1">
                                <i class="fas fa-edit"></i> 
                            </button>
                            <button class="btn btn-sm btn-danger me-1">
                                <i class="fas fa-trash"></i> 
                            </button>
                            <button (click)="openImageModal(getImageUrl(video.url))" class="btn btn-sm btn-info me-1">
                                <i class="fas fa-eye"></i> 
                            </button>
                            <a [href]="getImageUrl(video.url)">
                                <button class="btn btn-sm btn-success me-1">
                                  <i class="fas fa-download"></i>
                                </button>
                              </a>
                        </td>
                    </tr>
                </tbody>
            </table>

            <ng-template #noVideosTemplate>
                <div class="alert alert-warning text-center" role="alert">
                  Aucune vidéo disponible!
                </div>
              </ng-template>
        </div>
    </div>



<ng-template #imageModal let-modal>
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Aperçu de l'image</h5>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
      </div>
      <div class="modal-body">
        <video [src]="selectedVideoUrl" controls  class="img-fluid w-100"></video>
        
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="modal.dismiss('Close click')">Fermer</button>
        <a [href]="selectedVideoUrl" download class="btn btn-primary">Télécharger la vidéo</a>
      </div>
    </div>
  </ng-template>

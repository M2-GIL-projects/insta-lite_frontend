<div class="modal-content">
  <div class="modal-body p-0">
    <div class="row g-0">
      <!-- Section média (image/vidéo) -->
      <div class="col-md-7 bg-dark d-flex align-items-center justify-content-center">
        <ng-container *ngIf="item.pictures && item.pictures.length > 0; else videoSection">
          <img
            [src]="getImageUrl(item.pictures[0].url)"
            class="img-fluid w-100"
            alt="avatar"
            style="max-height: 500px; object-fit: cover;"
          />
        </ng-container>
        <ng-template #videoSection>
          <video
            *ngIf="item.videos && item.videos.length > 0"
            [src]="getImageUrl(item.videos[0].url)"
            class="img-fluid w-100"
            preload="metadata"
            controls
            style="max-height: 500px; object-fit: cover;"
          ></video>
        </ng-template>
      </div>

      <!-- Section détails -->
      <div class="col-md-5">
        <div class="d-flex flex-column h-100">
          <!-- Header -->
          <div class="d-flex justify-content-between align-items-center border-bottom p-3">
            <div class="d-flex align-items-center">
              <img
                [src]="getImageUrl(item.user?.url)"
                class="rounded-circle me-2"
                style="width: 40px; height: 40px; object-fit: cover;"
                alt="Photo de profil"
              />
              <span class="fw-bold">{{ currentUser?.pseudo }}</span>
            </div>
            <button type="button" class="btn-close" (click)="activeModal.dismiss()" aria-label="Close"></button>
          </div>

          <!-- Contenu principal -->
          <div class="flex-grow-1 p-3 overflow-auto">
            <p class="mb-0">
              <strong>Description <i class="fas fa-info-circle me-2"></i>: </strong> {{ item.content }}
            </p>
            <div class="text-muted small mt-2">
              {{ item.createdAt | date: 'longDate' }}
            </div>
            <!-- Badge Public/Privé -->
            <div class="mt-3">
              <span
                class="badge"
                [ngClass]="item.private ? 'bg-danger' : 'bg-success'"
              >
                {{ item.private ? 'Privé' : 'Public' }}
              </span>
            </div>
          </div>

          <!-- Footer avec actions -->
          <div class="border-top p-3">
            <div class="d-flex gap-2 mb-3">
              <button class="btn btn-outline-danger btn-sm d-flex align-items-center">
                <i class="fas fa-heart me-2"></i>{{ item.likes?.length }}
              </button>
              <button class="btn btn-outline-primary btn-sm d-flex align-items-center">
                <i class="fas fa-comment me-2"></i> {{ item.comments?.length }}
              </button>
            </div>

            <!-- Section des commentaires -->
            <h6 class="fw-bold">Commentaires</h6>
            <div class="comments-container">
              <ng-container *ngFor="let comment of item.comments; let i = index">
                <div *ngIf="i < 1 || item.showAllComments" class="d-flex align-items-start mb-3">
                  <!-- Avatar -->
                  <img
                    [src]="getImageUrl(comment.user.profileImg)"
                    alt="Photo de profil"
                    class="rounded-circle me-2"
                    style="width: 35px; height: 35px; object-fit: cover;"
                  />
                  <!-- Contenu du commentaire -->
                  <div class="comment-content">
                    <p class="mb-0">
                      <span class="fw-bold me-2">{{ comment.user.pseudo }}</span>
                      {{ comment.content }}
                    </p>
                    <small class="text-muted">
                      {{ comment.createdAt | date : "short" }}
                      <a href="#" class="ms-3 text-muted">Répondre</a>
                    </small>
                  </div>
                  <!-- Bouton supprimer -->
                  <button
                    *ngIf="comment.user?.pseudo === currentUser?.pseudo"
                    class="btn btn-sm btn-link text-danger ms-auto"
                    (click)="deleteComment(comment.id)"
                    style="font-size: 14px;"
                  >
                    <i class="fas fa-trash"></i>
                  </button>
                </div>
              </ng-container>

              <!-- Bouton "Voir plus" --> 
              <div *ngIf="item.comments.length > 1 && !item.showAllComments" class="text-center mt-2">
                <button class="btn btn-link text-decoration-none" (click)="item.showAllComments = true">
                  Voir {{ item.comments.length - 1 }} commentaires supplémentaires...
                </button>
              </div>

              <!-- Bouton "Masquer" -->
              <div *ngIf="item.comments.length > 2 && item.showAllComments" class="text-center mt-2">
                <button class="btn btn-link text-decoration-none" (click)="item.showAllComments = false">
                  Masquer les commentaires
                </button>
              </div>
            </div>

            <!-- Champ pour ajouter un commentaire -->
            <div *ngIf="currentUser" class="d-flex align-items-center mt-2">
              <input
                type="text"
                [(ngModel)]="commentContent"
                class="form-control me-2"
                placeholder="Ajoutez un commentaire..."
              />
              <button class="btn btn-primary btn-sm" (click)="addComment(item.id)">
                Publier
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

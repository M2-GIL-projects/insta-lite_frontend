<div class="container mt-4 mb-5">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h3 class="mb-0"><i class="fas fa-user-edit me-2"></i>Modifier le profil</h3>
    </div>

    <div class="card-body">
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        <div class="mb-4 text-center">
          <label for="profilePic" class="form-label fw-bold d-block">
            <i class="fas fa-camera me-2"></i>Photo de profil
          </label>
          <input
            type="file"
            class="form-control"
            id="photo"
            formControlName="photo"
            (change)="onFileSelected($event)"
            accept="image/*"
          />
          <div class="mt-3">
            <img
              [src]="selectedImageUrl || getImageUrl(currentProfileImageUrl) || 'assets/default.jpg'"
              alt="Photo de profil"
              class="img-thumbnail shadow-sm"
              style="max-width: 150px; border-radius: 50%;"
            />
          </div>
        </div>
        <div class="mb-4">
          <label for="pseudo" class="form-label fw-bold">
            <i class="fas fa-user me-2"></i>Nom d'utilisateur
          </label>
          <input
            type="text"
            class="form-control"
            id="pseudo"
            formControlName="pseudo"
            placeholder="Entrez votre nom d'utilisateur"
          />
          <div *ngIf="userForm.get('pseudo')?.invalid && (userForm.get('pseudo')?.dirty || userForm.get('pseudo')?.touched)" class="text-danger mt-1">
            <small *ngIf="userForm.get('pseudo')?.errors?.['required']">Le nom d'utilisateur est requis.</small>
            <small *ngIf="userForm.get('pseudo')?.errors?.['minlength']">Minimum 3 caractères.</small>
            <small *ngIf="userForm.get('pseudo')?.errors?.['maxlength']">Maximum 7 caractères.</small>
          </div>
        </div>

        <div class="mb-4">
          <label for="bio" class="form-label fw-bold">
            <i class="fas fa-info-circle me-2"></i>Biographie
          </label>
          <textarea
            class="form-control"
            id="content"
            rows="4"
            formControlName="content"
            placeholder="Écrivez ici votre contenu..."
            (input)="updateCharCount()"></textarea>
          <small class="text-muted">Caractères restants : {{ remainingChars }}</small>
          <div *ngIf="userForm.get('bio')?.invalid && (userForm.get('bio')?.dirty || userForm.get('bio')?.touched)" class="text-danger mt-1">
            <small>Maximum 255 caractères.</small>
          </div>
        </div>

        <div class="mb-4">
          <label for="email" class="form-label fw-bold">
            <i class="fas fa-envelope me-2"></i>Email
          </label>
          <input
            type="email"
            class="form-control"
            id="email"
            formControlName="email"
            placeholder="Adresse email"
            [disabled]="true"
          />
        </div>

        <div class="mb-4">
          <label for="phone" class="form-label fw-bold">
            <i class="fas fa-phone me-2"></i>Téléphone
          </label>
          <input
            type="tel"
            class="form-control"
            id="phone"
            formControlName="phone"
            placeholder="Numéro de téléphone"
          />
          <div *ngIf="userForm.get('phone')?.invalid && (userForm.get('phone')?.dirty || userForm.get('phone')?.touched)" class="text-danger mt-1">
            <small>Maximum 15 caractères.</small>
          </div>
        </div>

        <div class="mb-4 form-check">
          <input
            type="checkbox"
            class="form-check-input"
            id="changePassword"
            (change)="togglePasswordChange()"
          />
          <label class="form-check-label fw-bold" for="changePassword">
            <i class="fas fa-key me-2"></i>Changer le mot de passe
          </label>
        </div>

        <div *ngIf="isChangePassword">
          <div class="mb-4">
            <label for="password" class="form-label fw-bold">
              <i class="fas fa-lock me-2"></i>Nouveau mot de passe
            </label>
            <input
              type="password"
              class="form-control"
              id="password"
              formControlName="password"
              placeholder="Entrez un nouveau mot de passe"
            />
            <div *ngIf="userForm.get('password')?.invalid && (userForm.get('password')?.dirty || userForm.get('password')?.touched)" class="text-danger mt-1">
              <small>Minimum 8 caractères requis.</small>
            </div>
          </div>

          <div class="mb-4">
            <label for="confirmPassword" class="form-label fw-bold">
              <i class="fas fa-lock me-2"></i>Confirmer le mot de passe
            </label>
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              formControlName="confirmPassword"
              placeholder="Confirmez votre mot de passe"
            />
            <div *ngIf="userForm.hasError('mismatch') && userForm.get('confirmPassword')?.touched" class="text-danger mt-1">
              <small>Les mots de passe ne correspondent pas.</small>
            </div>
          </div>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn btn-primary w-100" [disabled]="!userForm.valid">
            <i class="fas fa-save me-2"></i>Enregistrer les modifications
          </button>
          <button type="button" class="btn btn-danger w-100" (click)="onCancel()">
            <i class="fas fa-times me-2"></i>Annuler
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

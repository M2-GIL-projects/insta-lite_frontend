<div class="container mt-5">
    <h2 class="mb-4">Galerie</h2>
    <div class="row">
      <div *ngFor="let image of images" class="col-md-4 mb-4">
        <div class="card">
          <img [src]="image.url" class="card-img-top" [alt]="image.title">
          <div class="card-body">
            <h5 class="card-title">{{ image.title }}</h5>
            <p class="card-text">{{ image.description }}</p>
            <button class="btn btn-primary" (click)="openModal(image)">Agrandir</button>
          </div>
        </div>
      </div>
    </div>
  </div>

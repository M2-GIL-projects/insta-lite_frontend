<div class="modal-header">
    <h4 class="modal-title">Ajouter un commentaire</h4>
    <button type="button" class="close" aria-label="Close" (click)="activeModal.dismiss()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>
<div class="modal-body">
    <textarea [(ngModel)]="commentContent" placeholder="Écrivez votre commentaire ici..." rows="3" class="form-control"></textarea>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-primary" (click)="submit()">Envoyer</button> <!-- Appel à submit sans argument -->
</div>
